<div class="container mt-5">

  <div class="card p-4 shadow">

    <h2 class="mb-4">Crear Examen</h2>

    <form>

      <div class="mb-3">
        <label class="form-label">Título del examen</label>

        <input
          type="text"
          class="form-control"
          placeholder="Ingrese un título">
      </div>

      <div class="mb-3">
        <label class="form-label">Descripción</label>

        <textarea
          class="form-control"
          rows="4"
          placeholder="Ingrese una descripción">
        </textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Categoría</label>

        <input
          type="text"
          class="form-control"
          placeholder="Ej: Matemática">
      </div>

      <div class="mb-3">

        <label class="form-label">
          Subir imagen o archivo del examen
        </label>

        <input
          type="file"
          class="form-control">

      </div>
      
      <button
        type="button"
        class="btn btn-primary"
        (click)="crearExamen()">
        Crear examen
      </button>
      
      <p class="mt-3 fw-bold text-success">
        {{ mensaje}}
      </p>

    </form>

  </div>

</div>
