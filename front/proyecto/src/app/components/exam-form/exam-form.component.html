<div class="container mt-5">

  <div class="card p-4 shadow">

    <h2 class="mb-4">Crear Examen</h2>

    <form [formGroup]="examenForm">

      <div class="mb-3">
        <label class="form-label">Título del examen</label>
      
        <input
          type="text"
          class="form-control"
          formControlName="titulo"
          placeholder="Ingrese un título">

          <div
            class="text-danger mt-1"
            *ngIf="examenForm.get('titulo')?.invalid &&
            examenForm.get('titulo')?.touched">

          <small *ngIf="examenForm.get('titulo')?.errors?.['required']">
              El título es obligatorio
          </small>

          <small *ngIf="examenForm.get('titulo')?.errors?.['minlength']">
              Debe tener al menos 3 caracteres
          </small>

        </div>

      </div>

      

      <div class="mb-3">
        <label class="form-label">Descripción</label>

        <textarea
          class="form-control"
          rows="4"
          formControlName="descripcion"
          placeholder="Ingrese una descripción">
        </textarea>

          <div
              class="text-danger mt-1"
              *ngIf="examenForm.get('descripcion')?.invalid &&
                    examenForm.get('descripcion')?.touched">

              <small *ngIf="examenForm.get('descripcion')?.errors?.['required']">
                La descripción es obligatoria
              </small>

              <small *ngIf="examenForm.get('descripcion')?.errors?.['minlength']">
                Debe tener al menos 10 caracteres
              </small>

          </div>

      </div>
      <div class="mb-3">
        <label class="form-label">Categoría</label>

        <input
          type="text"
          class="form-control"
           formControlName="categoria"
          placeholder="Ej: Matemática">

          <div
            class="text-danger mt-1"
            *ngIf="examenForm.get('categoria')?.invalid &&
                  examenForm.get('categoria')?.touched">

            <small>
              La categoría es obligatoria
            </small>

          </div>
      </div>

      <div class="mb-3">

        <label class="form-label">
          Subir imagen o archivo del examen
        </label>

        <input
          type="file"
          class="form-control">

      </div>
      
      <button
        type="button"
        class="btn btn-primary"
        (click)="crearExamen()">
        Crear examen
      </button>
      
      <p class="mt-3 fw-bold"
        [class.text-success]="mensaje === 'Examen creado correctamente'"
        [class.text-danger]="mensaje === 'Complete correctamente los campos'">
        
        {{ mensaje}}
      </p>

    </form>

  </div>

</div>
