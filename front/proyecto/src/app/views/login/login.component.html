<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h2 class="card-title text-center mb-4">Iniciar Sesión</h2>

                    <form [formGroup]="login_form" (ngSubmit)="on_submit()">

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-control"
                                [class.is-invalid]="email?.invalid && email?.touched" formControlName="email"
                                placeholder="tu@email.com">
                            <div class="invalid-feedback">
                                <span *ngIf="email?.errors?.['required']">El email es obligatorio.</span>
                                <span *ngIf="email?.errors?.['email']">Ingresá un email válido.</span>
                            </div>
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-3">
                            <label for="password_hash" class="form-label">Contraseña</label>
                            <input type="password" id="password_hash" class="form-control"
                                [class.is-invalid]="password_hash?.invalid && password_hash?.touched"
                                formControlName="password_hash" placeholder="Tu contraseña">
                            <div class="invalid-feedback">
                                <span *ngIf="password_hash?.errors?.['required']">La contraseña es obligatoria.</span>
                                <span *ngIf="password_hash?.errors?.['minlength']">Mínimo 8 caracteres.</span>
                            </div>
                        </div>

                        <!-- Botón -->
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary" [disabled]="login_form.invalid">
                                Iniciar Sesión
                            </button>
                        </div>

                    </form>

                    <p class="text-center mt-3">
                        ¿No tenés cuenta? <a routerLink="/registro">Registrate</a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>
